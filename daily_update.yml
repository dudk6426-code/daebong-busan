name: Daebong SEO Smart Publisher

# 신규 도메인(daebong-busan.kr)의 구글 Scaled Content Abuse(대량 저품질) 필터를 피하기 위해
# 매일 무작위 발행 대신 주 3회(월·수·금 오전 9시 KST = UTC 00:00) 고품질 세부 키워드 페이지를 발행합니다.
# 매일 발행이 필요해지면 cron을 '0 0 * * *'로 변경할 수 있습니다.
on:
  schedule:
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daebong-seo-publish
  cancel-in-progress: false

jobs:
  publish-seo-case:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SEO Publisher (Long-tail Keyword + Quality Guard)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -X utf8 automation/auto_seo_publisher.py

      - name: Commit and push newly generated SEO pages
        run: |
          git config user.name "daebong-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add auto-cases/ automation/published_history.json index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No new SEO pages to publish."
            exit 0
          fi
          git commit -m "seo: publish regional long-tail guide ($(date +'%Y-%m-%d'))"
          git push origin main
