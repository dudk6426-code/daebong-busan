name: Daebong Daily Auto SEO Update

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daebong-main-publisher
  cancel-in-progress: false

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 3. Run Automation
        env:
          TZ: 'Asia/Seoul'
        run: |
          python -X utf8 automation/main.py
          python -X utf8 automation/main.py --clear-memo
      - name: 4. Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Daebong Auto Bot"
          git add index.html
          git diff --staged --quiet || (git commit -m "auto(cloud): 매일 밤 9시 홈페이지 자동 업데이트" && git push)
