name: AI 홈페이지 정보글
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daebong-main-publisher
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: AI 정보글 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Seoul
        run: python -X utf8 automation/ai_writer.py website
      - name: 변경 사항 저장
        run: |
          git config user.name "Daebong Auto Bot"
          git config user.email "action@github.com"
          git add index.html automation/ai_post_history.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: AI 정보글 업데이트"
            git push
          fi
