name: Daebong Daily Auto SEO Update

on:
  schedule:
    # 매일 한국 시간 밤 9시 정각 (UTC 12:00) 자동 실행
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 세부 키워드 생성 및 홈페이지·블로그 원고 업데이트 실행
        env:
          TZ: 'Asia/Seoul'
        run: |
          python automation/main.py

      - name: 4. 변경된 홈페이지 및 오늘의 블로그 원고 자동 저장(Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Daebong Auto Bot"
          git add index.html automation/output/blog_draft.txt
          git diff --staged --quiet || (git commit -m "auto(cloud): 매일 밤 9시 홈페이지 및 블로그 원고 자동 생성" && git push)